name: ocr2md cloud smoke

on:
  push:
    branches:
      - gpt/web
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Build cloud smoke demo
        env:
          OCR2MD_GOOGLE_CLIENT_ID: ${{ vars.OCR2MD_GOOGLE_CLIENT_ID }}
          OCR2MD_GOOGLE_ROOT_FOLDER_ID: ${{ vars.OCR2MD_GOOGLE_ROOT_FOLDER_ID }}
        run: npm run build:cloud-smoke

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cloud-smoke-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
