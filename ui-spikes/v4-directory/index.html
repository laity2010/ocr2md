  <script id="v4-bootstrap" data-testid="v4-bootstrap" data-entry="./app.js?build=v4-261015-0114">
  (()=>{
    'use strict';
    // This boot boundary has no remote dependencies. It must execute even when
    // the WCP CDN or any bundled plugin import cannot be reached.
    const node=document.getElementById('v4-bootstrap');
    const label=document.getElementById('v4-build-label');
    const indicator=document.getElementById('status');
    const bar=document.getElementById('v4-framework-status');
    const failure=document.getElementById('v4-startup-failure');
    const retry=document.getElementById('v4-startup-retry');
    const diagnostic=document.getElementById('v4-startup-diagnostic');
    const build=label?.dataset.buildId||'unknown';
    const started=performance.now();
    const session={build,phase:'loading',stage:'document',errorCode:'',resourceOrigin:'',attempt:0};
    const whitelist=new Set(['ocr2md.laity.bid','wcp.laity.bid','agent-link.laity.bid']);
    const state=()=>({...session,elapsedMs:Math.round(performance.now()-started),
      navigationType:performance.getEntriesByType('navigation')[0]?.type||'unknown'});
    const output=()=>{
      const item=state();
      diagnostic.textContent='启动诊断：'+item.build+' / '+item.phase+' / '+item.stage+
        (item.errorCode?' / '+item.errorCode:'')+(item.resourceOrigin?' / '+item.resourceOrigin:'');
    };
    const dirty=()=>bar?.dataset.level==='dirty'||Boolean(
      document.querySelector('#v4-module-mount [data-unsaved]'))||
      Boolean(document.activeElement?.closest('textarea,input,[contenteditable="true"],.cm-editor'));
    function failed(code){
      if(session.phase==='ready')return;
      session.phase='error';session.stage='bootstrap';session.errorCode=code;
      window.__ocr2mdV4={phase:'error',stage:'bootstrap',error:code};
      bar.dataset.level='error';indicator.textContent='应用启动失败（'+code+'），请重试';
      indicator.title=indicator.textContent;
      failure.hidden=false;output();
    }
    function classify(error){
      const kind=error?.name;
      return kind==='TypeError'?'DEPENDENCY_LOAD_FAILED':
        kind==='SyntaxError'?'MODULE_PARSE_FAILED':'APPLICATION_START_FAILED';
    }
    window.__v4Startup={state,mark(stage){
      if(session.phase!=='loading')return;
      session.stage=stage;output();
    },ready(){
      session.phase='ready';session.stage='mounted';session.errorCode='';
      failure.hidden=true;output();
    },fail:failed};
    window.__ocr2mdV4={phase:'loading',stage:'document'};
    window.addEventListener('error',event=>{
      const url=event.target?.src||event.target?.href;
      if(!url||session.phase==='ready')return;
      try{const u=new URL(url,location.href);if(whitelist.has(u.hostname)){
        session.resourceOrigin=u.origin;output();
      }}catch{}
    },true);
    retry.addEventListener('click',()=>{
      if(dirty()){indicator.textContent='存在未保存内容，已停止重新加载';return}
      const next=new URL(location.href);
      next.searchParams.set('recover',String(Date.now()));
      location.replace(next.href);
    });
    // No promise from WCP imports may escape this boundary without a visible
    // failure. Do not treat the HTML build label as a successful app startup.
    session.stage='entry-import';session.attempt++;
    output();
    import(new URL(node.dataset.entry,location.href).href).catch(error=>{
      failed(classify(error));
    });
    // A slow CDN must remain diagnosable even if the import never settles.
    setTimeout(()=>{
      if(session.phase==='loading'){
        session.stage='slow-startup';
        indicator.textContent='应用仍在启动；若长时间无响应，请检查网络后重试';
        bar.dataset.level='busy';failure.hidden=false;output();
      }
    },35000);
  })();
  </script>
