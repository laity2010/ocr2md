    #preview h3 { color: var(--obsidian-h3); font-size: var(--obsidian-h3-size); }
    #preview h4 { color: var(--obsidian-h4); font-size: var(--obsidian-h4-size); }
    #preview h5 { color: var(--obsidian-h5); font-size: var(--obsidian-h5-size); }
    #preview h6 { color: var(--obsidian-h6); font-size: var(--obsidian-h6-size); }
    #preview pre { overflow: auto; padding: 10px; background: var(--obsidian-bg-alt); }

    #preview table { border-collapse: collapse; width: max-content; min-width: 100%; }

    #preview .md-html-block { overflow-x: auto; }
    #preview .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
    .cm-editor { height: 100%; font: 300 var(--right-font-size)/1.6 var(--obsidian-font); background: var(--obsidian-bg); color: var(--obsidian-fg); }
    .cm-scroller { overflow: auto; font-family: var(--obsidian-font); }
    .cm-gutters { background: var(--obsidian-bg-alt) !important; color: color-mix(in srgb, var(--obsidian-fg) 62%, transparent) !important; border-right: 0 !important; }
    .cm-content, .cm-line { font-family: var(--obsidian-font); font-synthesis: none; }
    .cm-line.cm-obsidian-h1, .cm-line.cm-obsidian-h2, .cm-line.cm-obsidian-h3,
    .cm-line.cm-obsidian-h4, .cm-line.cm-obsidian-h5, .cm-line.cm-obsidian-h6 { font-weight: 500; line-height: 1.3; }
    .cm-line.cm-obsidian-h1 { color: var(--obsidian-h1); font-size: var(--obsidian-h1-size); }
    .cm-line.cm-obsidian-h2 { color: var(--obsidian-h2); font-size: var(--obsidian-h2-size); }
    .cm-line.cm-obsidian-h3 { color: var(--obsidian-h3); font-size: var(--obsidian-h3-size); }
    .cm-line.cm-obsidian-h4 { color: var(--obsidian-h4); font-size: var(--obsidian-h4-size); }
    .cm-line.cm-obsidian-h5 { color: var(--obsidian-h5); font-size: var(--obsidian-h5-size); }
    .cm-line.cm-obsidian-h6 { color: var(--obsidian-h6); font-size: var(--obsidian-h6-size); }
    .cm-obsidian-latex-function { color: var(--obsidian-code-function); }
    .cm-obsidian-latex-operator { color: var(--obsidian-code-operator); }
    .cm-obsidian-latex-value { color: var(--obsidian-code-value); }
    .cm-obsidian-latex-punctuation { color: var(--obsidian-code-punctuation); }
    .cm-ocr-target-line { background: color-mix(in srgb, Highlight 20%, transparent); }
    .cm-ocr-regex-match,
    #preview mark.ocr-regex-match {
      background: rgba(255, 170, 0, 0.30);
      color: inherit;
      border-radius: 2px;
    }
    .cm-ocr-regex-match.is-active,
    #preview mark.ocr-regex-match.is-active {
      background: rgba(255, 170, 0, 0.58);
      outline: 1px solid #ff9e64;
    }
    .cm-ocr-eol {
      display: inline-block;
      margin-inline-start: 0.25em;
      color: #ff9e64;
      font-size: 0.78em;
      font-weight: 500;
      opacity: 0.95;
      user-select: none;
      pointer-events: none;
    }
    @media (max-width: 600px) {
      .workspace { grid-template-columns: 1fr; grid-template-rows: 42vh minmax(0, 1fr); }

  </style>
</head>
<body>
  <nav class="workspace-switcher" aria-label="工作区">
    <span class="workspace-brand">ocr2md <span id="workspace-version" class="workspace-version">v0.0.1 · --</span></span>
    <button class="workspace-tab" type="button" data-workspace="cleaning">清洗工作区</button>
    <button class="workspace-tab is-active" type="button" data-workspace="gd">GD 工作区</button>
    <div id="ui-debug-picker" class="ui-debug-picker">
      <button id="ui-debug-toggle" class="ui-debug-toggle" type="button" aria-haspopup="menu" aria-expanded="false" aria-disabled="true" disabled>功能调试 ▾</button>
      <div id="ui-debug-menu" class="ui-debug-menu" role="menu" hidden>
        <div class="feature-debug-intro">
          <strong>功能规范</strong> · 点击项目运行固定样例。自动测试只做预检，最终以人工运行审核为准。
        </div>
        <button id="ui-debug-initialize" class="ui-debug-action" type="button" role="menuitem">
          <span class="feature-debug-title">初始化</span>
          <span class="feature-debug-spec"><b>操作</b>：恢复固定功能样例。</span>
          <span class="feature-debug-spec"><b>需要</b>：无。</span>
          <span class="feature-debug-spec"><b>效果</b>：working 恢复基线，所有功能项目重新可运行。</span>
        </button>
        <button id="ui-debug-move-source-block" class="ui-debug-action" type="button" role="menuitem" title="UIC-CLEAN-001 · 376–378 → 359" disabled>
          <span class="feature-debug-title">移动源文本块</span>
          <span class="feature-debug-spec"><b>操作</b>：将工作稿第 376–378 行移动到第 359 行之前。</span>
          <span class="feature-debug-spec"><b>需要</b>：固定 source 基线；清洗工作区。</span>
          <span class="feature-debug-spec"><b>效果</b>：工作稿完成移动；章节标题定位 Editor’s Note；变动行显示 +4。</span>
        </button>
        <button id="ui-debug-line-menu" class="ui-debug-action" type="button" role="menuitem" title="UIC-DEBUG-003 · 18→14，点击 14 行号 → 加入嵌入块表">
          <span class="feature-debug-title">行号菜单</span>
          <span class="feature-debug-spec"><b>操作</b>：点击源码行号，使用“加入当前数据表”人工加入目标行。</span>
          <span class="feature-debug-spec"><b>需要</b>：清洗工作区；章节模式；当前数据表允许人工加入。</span>
          <span class="feature-debug-spec"><b>效果</b>：固定样例把第 14 行 Top Award 加入嵌入块；正常工作区也可直接手动操作。</span>
        </button>
        <button id="ui-debug-edit-text-line" class="ui-debug-action" type="button" role="menuitem" title="UIC-DEBUG-006 · 修正第 26 行 OCR 文本 → 变动行">
          <span class="feature-debug-title">修改文本行</span>
          <span class="feature-debug-spec"><b>操作</b>：精确修正第 26 行指定 OCR 片段。</span>
          <span class="feature-debug-spec"><b>需要</b>：原 OCR 片段存在；行尾 &lt;sup&gt;1&lt;/sup&gt; 保持不动。</span>
          <span class="feature-debug-spec"><b>效果</b>：变动行显示第 26 行“修改 / 未归类”；原注释引用继续保留。</span>
        </button>
        <button id="ui-debug-ignore-line-type" class="ui-debug-action" type="button" role="menuitem" title="UIC-GRID-001 · 行类型统一支持已忽略">
          <span class="feature-debug-title">行类型：已忽略</span>
          <span class="feature-debug-spec"><b>操作</b>：把当前候选行的行类型改为“已忽略”。</span>
          <span class="feature-debug-spec"><b>需要</b>：任意可编辑数据表存在候选行；固定样例使用第 26 行注释引用。</span>
          <span class="feature-debug-spec"><b>效果</b>：该行从当前数据表隐藏；标定状态保留；working 不变；所有可编辑模块均有同一选项。</span>
        </button>
        <button id="ui-debug-undo-redo" class="ui-debug-action" type="button" role="menuitem" title="UIC-DEBUG-008 · 撤销 / 重做完整流程">
          <span class="feature-debug-title">撤销 / 重做</span>
          <span class="feature-debug-spec"><b>操作</b>：一次运行“已忽略 → Undo → Redo → Undo → 新文本修改 → Undo”的完整流程。</span>
          <span class="feature-debug-spec"><b>需要</b>：固定 source 基线；Undo / Redo 历史从空状态开始。</span>
          <span class="feature-debug-spec"><b>效果</b>：6 个步骤在界面逐步显示；验证状态恢复、Redo、分支失效以及文本/标定两类撤销。</span>
        </button>
        <button id="ui-debug-save-reenter" class="ui-debug-action" type="button" role="menuitem" title="UIC-DEBUG-009 · 保存标定并重入自动加载">
          <span class="feature-debug-title">保存标定 / 重入加载</span>
          <span class="feature-debug-spec"><b>操作</b>：修改正文并做人工标定，保存后模拟离开章节，再重新进入。</span>
          <span class="feature-debug-spec"><b>需要</b>：固定章节 fixture；功能调试使用内存持久化，不写真实 Google Drive。</span>
          <span class="feature-debug-spec"><b>效果</b>：重入后自动恢复已保存 working 与 sidecar 标定；人工“已忽略”不会被重扫覆盖。</span>
        </button>
      </div>
    </div>

      <button id="gd-refresh" type="button">刷新</button>
      <button id="gd-set-workdir" type="button">设当前目录为工作目录</button>
      <span class="gd-spacer"></span>
      <button id="gd-open" type="button" hidden>打开到清洗工作区</button>
      <button id="gd-rename" type="button" hidden>重命名</button>
      <button id="gd-disconnect" type="button">断开</button>
    </div>
    <nav id="gd-breadcrumbs" class="gd-breadcrumbs" aria-label="Google Drive 路径"></nav>
    <div class="gd-browser">
      <div class="gd-list-header" role="row">
        <span></span>
        <span>名称</span>
        <span>类型</span>
      </div>
      <div id="gd-list" role="rowgroup"></div>

    </div>

  <script src="./node_modules/js-fileexplorer/file-explorer/file-explorer.js"></script>
  <script type="module">
    const appUrl = "./app.js?v=" + Date.now();
    const versionEl = document.getElementById("workspace-version");

    try {
      const response = await fetch(appUrl, { method: "HEAD", cache: "no-store" });
      const lastModified = response.headers.get("Last-Modified");
      if (versionEl && lastModified) {
        const updatedAt = new Date(lastModified);
        const stamp = new Intl.DateTimeFormat("sv-SE", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        }).format(updatedAt);
        versionEl.textContent = "v0.0.1 · " + stamp;
      }
    } catch {
      // Keep the version visible even if Last-Modified is unavailable.
    }

    import(appUrl);
  </script>
