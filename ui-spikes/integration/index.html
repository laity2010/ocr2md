    .cm-line.cm-obsidian-h1, .cm-line.cm-obsidian-h2, .cm-line.cm-obsidian-h3,
    .cm-line.cm-obsidian-h4, .cm-line.cm-obsidian-h5, .cm-line.cm-obsidian-h6 { font-weight: 500; line-height: 1.3; }
    .cm-line.cm-obsidian-h1 { color: var(--obsidian-h1); font-size: var(--obsidian-h1-size); }
    .cm-line.cm-obsidian-h2 { color: var(--obsidian-h2); font-size: var(--obsidian-h2-size); }
    .cm-line.cm-obsidian-h3 { color: var(--obsidian-h3); font-size: var(--obsidian-h3-size); }
    .cm-line.cm-obsidian-h4 { color: var(--obsidian-h4); font-size: var(--obsidian-h4-size); }
    .cm-line.cm-obsidian-h5 { color: var(--obsidian-h5); font-size: var(--obsidian-h5-size); }
    .cm-line.cm-obsidian-h6 { color: var(--obsidian-h6); font-size: var(--obsidian-h6-size); }
    .cm-obsidian-latex-function { color: var(--obsidian-code-function); }
    .cm-obsidian-latex-operator { color: var(--obsidian-code-operator); }
    .cm-obsidian-latex-value { color: var(--obsidian-code-value); }
    .cm-obsidian-latex-punctuation { color: var(--obsidian-code-punctuation); }
    .cm-ocr-target-line { background: color-mix(in srgb, Highlight 20%, transparent); }
    .cm-ocr-regex-match,
    #preview mark.ocr-regex-match {
      background: rgba(255, 170, 0, 0.30);
      color: inherit;
      border-radius: 2px;
    }
    .cm-ocr-regex-match.is-active,
    #preview mark.ocr-regex-match.is-active {
      background: rgba(255, 170, 0, 0.58);
      outline: 1px solid #ff9e64;
    }
    .cm-ocr-eol {
      display: inline-block;
      margin-inline-start: 0.25em;
      color: #ff9e64;
      font-size: 0.78em;
      font-weight: 500;
      opacity: 0.95;
      user-select: none;
      pointer-events: none;
    }
    @media (max-width: 600px) {
      .workspace { grid-template-columns: 1fr; grid-template-rows: 42vh minmax(0, 1fr); }
      .grid-pane { border-bottom: 1px solid color-mix(in srgb, var(--obsidian-fg) 35%, transparent); }
      #splitter-vertical { display: none; }
      .workspace-document { display: none; }
      .gd-list-header, .gd-entry { grid-template-columns: 20px minmax(140px, 1fr) 62px; }
    }
  </style>
</head>
<body>
  <nav class="workspace-switcher" aria-label="工作区">
    <span class="workspace-brand">ocr2md <span id="workspace-version" class="workspace-version">v0.0.1 · --</span></span>
    <button class="workspace-tab is-active" type="button" data-workspace="cleaning">清洗工作区</button>
    <button class="workspace-tab" type="button" data-workspace="gd">GD 工作区</button>
    <button class="workspace-tab" type="button" data-workspace="jsfe">GD · JSFE</button>
    <span id="workspace-document" class="workspace-document">本地示例 · Buffett’s Alpha</span>
  </nav>
  <div id="cleaning-workspace" class="workspace">
    <section class="grid-pane">
      <div class="pane-menu grid-menu">
        <span class="pane-title">数据表</span>
        <span class="module-tags" role="tablist" aria-label="标定模块">
          <button class="module-tag boundary-module-tag" type="button" data-module="章节定界" hidden>章节定界</button>
          <button class="module-tag is-active" type="button" data-module="章节标题">章节标题</button>
          <button class="module-tag" type="button" data-module="注释">注释</button>
          <button class="module-tag" type="button" data-module="嵌入块">嵌入块</button>
          <button class="module-tag" type="button" data-module="非法断行">非法断行</button>
        </span>
      </div>
      <section id="review-grid"></section>
      <div class="pane-status grid-statusbar" role="status" aria-live="polite">
        <span id="grid-status" class="status"></span>
        <span id="grid-selected" class="status status-secondary"></span>
      </div>
    </section>
    <div id="splitter-vertical" class="splitter" role="separator" aria-orientation="vertical" tabindex="0"></div>
    <section class="editor-pane">
      <div class="pane-menu editor-menu">
        <span class="regex-search">
          <input id="regex-search" type="text" spellcheck="false" placeholder="正则搜索，例如 ^#{1,6}\\s">
          <select id="search-target" aria-label="搜索目标">
            <option value="source">源码</option>
            <option value="preview">预览</option>
            <option value="both">两边</option>
          </select>
          <label><input id="search-case" type="checkbox"> 区分大小写</label>
          <button id="search-prev" type="button" title="上一个匹配（Shift+Enter）">↑</button>
          <button id="search-next" type="button" title="下一个匹配（Enter）">↓</button>
        </span>
      </div>
      <section id="editor"></section>
      <div id="splitter-horizontal" class="splitter" role="separator" aria-orientation="horizontal" tabindex="0"></div>
      <article id="preview"></article>
      <div class="pane-status editor-statusbar" role="status" aria-live="polite">
        <span id="status"></span>
        <span id="search-status" class="status-secondary"></span>
      </div>
    </section>
  </div>
  <section id="gd-workspace" class="gd-workspace" hidden>
    <div class="gd-toolbar">
      <span class="pane-title">Google Drive</span>
      <button id="gd-connect" type="button">连接</button>
      <button id="gd-up" type="button">上级</button>
      <button id="gd-refresh" type="button">刷新</button>
      <span class="gd-spacer"></span>
      <button id="gd-open" type="button">打开到清洗工作区</button>
      <button id="gd-rename" type="button">重命名</button>
      <button id="gd-disconnect" type="button">断开</button>
    </div>
    <nav id="gd-breadcrumbs" class="gd-breadcrumbs" aria-label="Google Drive 路径"></nav>
    <div class="gd-browser">
      <div class="gd-list-header" role="row">
        <span></span>
        <span>名称</span>
        <span>类型</span>
      </div>
      <div id="gd-list" role="rowgroup"></div>
    </div>
    <div class="pane-status gd-statusbar" role="status" aria-live="polite">
      <span id="gd-status"></span>
      <span id="gd-selection-status" class="status-secondary">未连接</span>
    </div>
  </section>
  <section id="gd-jsfe-workspace" class="jsfe-workspace" hidden>
    <div class="jsfe-toolbar">
      <span class="pane-title">js-fileexplorer · Google Drive spike</span>
      <button id="gd-jsfe-connect" type="button">连接</button>
      <button id="gd-jsfe-disconnect" type="button">断开</button>
      <span class="jsfe-spacer"></span>
      <span>双击 Markdown → 清洗工作区</span>
    </div>
    <div id="gd-jsfe-host"></div>
    <div class="pane-status" role="status" aria-live="polite">
      <span id="gd-jsfe-status">尚未启动</span>
      <span id="gd-jsfe-selection" class="status-secondary"></span>
    </div>
  </section>
  <script src="./node_modules/js-fileexplorer/file-explorer/file-explorer.js"></script>
  <script type="module">
    const appUrl = "./app.js?v=" + Date.now();
    const versionEl = document.getElementById("workspace-version");

    try {
      const response = await fetch(appUrl, { method: "HEAD", cache: "no-store" });
      const lastModified = response.headers.get("Last-Modified");
      if (versionEl && lastModified) {
        const updatedAt = new Date(lastModified);
        const stamp = new Intl.DateTimeFormat("sv-SE", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        }).format(updatedAt);
        versionEl.textContent = "v0.0.1 · " + stamp;
      }
    } catch {
      // Keep the version visible even if Last-Modified is unavailable.
    }

    import(appUrl);
  </script>
</body>
</html>
