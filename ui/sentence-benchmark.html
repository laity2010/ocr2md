<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OCR2MD V6 · Sentence Benchmark Lab</title>
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="identity">
        <div class="brand">OCR2MD V6</div>
        <span id="build-version" class="build-badge" title="Sentence Lab 构建版本">lab-载入中</span>
        <span id="status" class="status" role="status" aria-live="polite">分句实验初始化中</span>
      </div>
      <div class="source-actions">
        <a class="ocr-sb-main-link" href="./lab-home.html">Lab 首页</a>
        <a class="ocr-sb-main-link" href="./index.html">V6 工作台</a>
        <button id="toggle-translation" type="button"
          aria-expanded="false" aria-controls="translation-drawer">待翻译句块表</button>
        <button id="toggle-review" type="button" aria-expanded="false" aria-controls="review-drawer">人工裁决 / Gold</button>
      </div>
    </header>
    <nav class="module-controls ocr-sb-controls" aria-label="分句工作台工具栏">
      <span class="ocr-sb-field-name">样本</span>
      <select id="sample-select" aria-label="文本样本"></select>
      <label class="ocr-sb-upload">导入 MD
        <input id="sample-file" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
      </label>
      <button id="delete-sample" type="button">移除</button>
      <span id="sample-meta" class="ocr-sb-meta"></span>
      <span class="ocr-sb-counter">分歧 <strong id="kpi-diffs">—</strong></span>
      <span class="ocr-sb-counter">审阅 <strong id="kpi-reviewed">—</strong></span>
      <span class="ocr-sb-counter">引擎 <strong id="kpi-engines">—</strong></span>
      <span class="ocr-sb-counter">重组 <strong id="kpi-roundtrip">—</strong></span>
      <span class="ocr-sb-counter">落盘 <strong id="kpi-saved">—</strong></span>
    </nav>
    <main class="ocr-sb-main">
      <div id="workspace" aria-label="原始 CMD 与三个分句引擎四窗对照"></div>
      <section id="translation-drawer" class="ocr-sb-translation"
        aria-label="统一待翻译句块表" hidden>
        <div class="ocr-sb-translation-toolbar">
          <strong>待翻译句块表</strong>
          <span id="translation-summary">—</span>
          <button id="export-translation" type="button">导出 AI JSON</button>
          <button id="close-translation" type="button">收起</button>
        </div>
        <div class="ocr-sb-translation-scroll">
          <table id="translation-table">
            <thead><tr><th>记录 ID</th><th>所属 PBS 块</th><th>类型</th>
              <th>句界依据</th><th>待校对翻译原文</th><th>校对原句</th><th>译文</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
      <section id="review-drawer" class="ocr-sb-review" aria-label="人工句界审阅与评分" hidden>
        <div class="ocr-sb-review-left">
          <div class="ocr-sb-review-toolbar">
            <strong>人工句界审阅</strong>
            <select id="review-filter" aria-label="审阅范围">
              <option value="disagree">只看分歧</option>
              <option value="all">全部句界</option>
              <option value="pending">仅未审阅</option>
            </select>
            <button id="prev-issue" type="button">上一处</button>
            <span id="issue-number">—</span>
            <button id="next-issue" type="button">下一处</button>
          </div>
          <p id="issue-summary" class="ocr-sb-issue-summary"></p>
          <div id="engine-judgments" class="engine-judgments"></div>
          <div class="judge-buttons">
            <button id="approve-issue" type="button">✓ 应当断句</button>
            <button id="reject-issue" type="button">× 不应断句</button>
            <button id="clear-issue" type="button">撤销裁决</button>
            <button id="manual-issue" type="button">手工补句界</button>
          </div>
          <div id="manual-picker" class="manual-picker" hidden>
            <h3>点击字符，在该字符后新增 Gold 句界</h3>
            <div id="manual-chars" class="manual-chars"></div>
            <button id="cancel-manual" type="button">取消</button>
          </div>
        </div>
        <div class="ocr-sb-review-right">
          <div class="ocr-sb-review-toolbar">
            <strong>分歧索引</strong><span id="issue-list-count"></span>
            <button id="export-gold" type="button">导出 Gold</button>
            <label class="ocr-sb-upload">导入 Gold <input id="gold-file" type="file" accept=".json,application/json" hidden></label>
            <button id="export-report" type="button">导出评分</button>
          </div>
          <div id="issue-list" class="issue-list"></div>
          <table id="score-table">
            <thead><tr><th>引擎</th><th>句数</th><th>耗时</th><th>精确率</th><th>召回率</th><th>F1</th><th>无损</th></tr></thead>
            <tbody></tbody>
          </table>
          <p id="gold-note" class="ocr-sb-note"></p>
        </div>
        <div class="ocr-sb-advanced" hidden>
          <div id="engine-options"></div>
          <select id="display-engine" aria-label="原文句界显示引擎"></select>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="./sentence-benchmark-app.js"></script>
</body>
</html>
