<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>OCR2MD V6 · Lab PDF（组件开发）</title></head>
<body>
<div class="app">
  <header class="toolbar">
    <div class="identity">
      <a id="lab-pdf-home" class="brand frame-brand" href="/labs/" title="返回 Lab 首页">OCR2MD lab-pdf</a>
      <span id="build-version" class="build-badge frame-version" aria-label="构建版本">00000000-0000</span>
      <span id="status" class="status" role="status" aria-live="polite">正在初始化 PDF 开发框架</span>
    </div>
    <div class="source-actions"><button id="global-save" class="primary" type="button">保存</button></div>
  </header>
  <main>
    <div id="workspace" aria-label="PDF 组件开发四窗（公共 PDF.js Viewer + PBS 覆盖框）"></div>
    <div id="settings-workspace" hidden aria-label="全局设置三窗"></div>
  </main>
</div>
<script type="module" src="./frame.js"></script>
</body>
</html>
