<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>OCR2MD V6 · Lab Frame</title></head>
<body>
<div class="app">
  <header class="toolbar">
    <div class="identity">
      <a id="lab-frame-home" class="brand frame-brand" href="/labs/" title="返回 Lab 首页">OCR2MD lab-frame</a>
      <span id="build-version" class="build-badge frame-version" aria-label="构建版本">00000000-0000</span>
      <span id="status" class="status" role="status" aria-live="polite">正在初始化空白框架</span>
    </div>
  </header>
  <main>
    <div id="workspace" aria-label="空白 AG、Markdown 源码、Markdown 预览和 PDF 四窗"></div>
    <div id="settings-workspace" hidden aria-label="空白全局设置三窗"></div>
  </main>
</div>
<script type="module" src="./frame.js"></script>
</body>
</html>
